<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Cursor gradient. Change stop-color to adjust cursor blue. -->
    <linearGradient id="cursorGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7CC4F5" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7CC4F5" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow filter for the highlighted row. Increase stdDeviation for a softer, wider glow. -->
    <filter id="rowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <!--
    Data rows: five rounded bars.
    Change fill to adjust normal row color.
    Change fill-opacity to make rows more/less prominent (currently 0.5).
  -->
  <g fill="#FFFFFF" fill-opacity="0.5">
    <rect x="272" y="288" width="480" height="56" rx="28" ry="28"/>
    <rect x="272" y="384" width="480" height="56" rx="28" ry="28"/>
    <rect x="272" y="480" width="480" height="56" rx="28" ry="28"/>
    <rect x="272" y="576" width="480" height="56" rx="28" ry="28"/>
    <rect x="272" y="672" width="480" height="56" rx="28" ry="28"/>
  </g>

  <!--
    Highlighted row glow: same shape as the highlighted row, drawn behind it.
    Change fill to adjust glow color, opacity to tune glow intensity.
  -->
  <rect x="272" y="480" width="480" height="56" rx="28" ry="28"
        fill="#F97316" opacity="0.7" filter="url(#rowGlow)"/>

  <!--
    Highlighted row: the one being edited.
    Change fill for highlight color, stroke and stroke-width for the outline.
  -->
  <rect x="272" y="480" width="480" height="56" rx="28" ry="28"
        fill="#FF7A1A" stroke="#FDBA74" stroke-width="4"/>

  <!--
    Cursor: short vertical bar on the left side of the highlighted row.
    Change fill to adjust cursor color, or change width/height for size.
  -->
  <rect x="300" y="492" width="10" height="32" rx="5" ry="5" fill="url(#cursorGradient)"/>
</svg>
