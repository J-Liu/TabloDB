name: Build macOS App

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Cache Swift packages
      uses: actions/cache@v4
      with:
        path: |
          .build
          ~/Library/Caches/org.swift.swiftpm
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-

    - name: Import signing certificate
      run: |
        echo "${{ secrets.SIGNING_CERTIFICATE }}" | base64 --decode > /tmp/cert.p12

        security create-keychain -p "" build.keychain
        security default-keychain -s build.keychain
        security unlock-keychain -p "" build.keychain
        security list-keychains -s build.keychain

        security import /tmp/cert.p12 -k build.keychain \
          -P "${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}" \
          -T /usr/bin/codesign

        security set-key-partition-list -S apple-tool:,apple:,codesign: \
          -s -k "" build.keychain

        rm /tmp/cert.p12

    - name: Build and package
      run: |
        chmod +x build.sh
        ./build.sh

    - name: Create ZIP for Sparkle
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        zip -r "TabloDB-${VERSION}.zip" TabloDB.app

    - name: Sign update
      if: startsWith(github.ref, 'refs/tags/')
      id: sign
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        ZIP="TabloDB-${VERSION}.zip"

        echo "${{ secrets.SPARKLE_PRIVATE_KEY }}" > /tmp/sparkle_key.txt
        RAW=$(./.build/artifacts/sparkle/Sparkle/bin/sign_update "$ZIP" --ed-key-file /tmp/sparkle_key.txt)
        rm /tmp/sparkle_key.txt

        SIGNATURE=$(echo "$RAW" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')

        LENGTH=$(stat -f%z "$ZIP")
        BUILD_NUMBER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" TabloDB.app/Contents/Info.plist)

        echo "signature=$SIGNATURE" >> "$GITHUB_OUTPUT"
        echo "length=$LENGTH" >> "$GITHUB_OUTPUT"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "build=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

    - name: Upload app bundle
      uses: actions/upload-artifact@v4
      with:
        name: TabloDB-app
        path: TabloDB.app

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          TabloDB-*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Update appcast
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        VERSION="${{ steps.sign.outputs.version }}"
        SIGNATURE="${{ steps.sign.outputs.signature }}"
        LENGTH="${{ steps.sign.outputs.length }}"
        BUILD="${{ steps.sign.outputs.build }}"
        DATE=$(date -u +"%a, %d %b %Y %H:%M:%S +0000")

        NEW_ITEM=$(cat <<EOF
        <item>
            <title>Version ${VERSION}</title>
            <pubDate>${DATE}</pubDate>
            <sparkle:version>${BUILD}</sparkle:version>
            <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
            <sparkle:minimumSystemVersion>13.0</sparkle:minimumSystemVersion>
            <enclosure
                url="https://github.com/J-Liu/TabloDB/releases/download/v${VERSION}/TabloDB-${VERSION}.zip"
                sparkle:edSignature="${SIGNATURE}"
                length="${LENGTH}"
                type="application/octet-stream"/>
        </item>
        EOF
        )

        python3 - <<PYEOF
        import re
        path = "docs/appcast.xml"
        with open(path) as f:
            content = f.read()

        new_item = """${NEW_ITEM}"""

        content = re.sub(
            r'(<language>en</language>)',
            r'\1\n\n    ' + new_item,
            content,
            count=1
        )

        with open(path, "w") as f:
            f.write(content)
        PYEOF

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add docs/appcast.xml
        git commit -m "Update appcast for v${VERSION}"
        git push origin HEAD:main
