name: Build macOS App

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Cache Swift packages
      uses: actions/cache@v4
      with:
        path: |
          .build
          ~/Library/Caches/org.swift.swiftpm
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-

    - name: Import signing certificate
      run: |
        echo "==> Decoding certificate from base64..."
        echo "${{ secrets.SIGNING_CERTIFICATE }}" | base64 --decode > /tmp/cert.p12
        echo "==> Certificate decoded, size: $(stat -f%z /tmp/cert.p12) bytes"

        echo "==> Creating keychain..."
        security create-keychain -p "" build.keychain
        security default-keychain -s build.keychain
        security unlock-keychain -p "" build.keychain
        security list-keychains -s build.keychain
        echo "==> Keychain created and configured"

        echo "==> Importing certificate..."
        security import /tmp/cert.p12 -k build.keychain \
          -P "${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}" \
          -T /usr/bin/codesign
        echo "==> Certificate imported"

        echo "==> Setting key partition list..."
        security set-key-partition-list -S apple-tool:,apple:,codesign: \
          -s -k "" build.keychain
        echo "==> Key partition list set"

        echo "==> Adding certificate to trusted root..."
        security find-certificate -c "Local Development Signing" -p build.keychain > /tmp/cert.pem
        sudo security add-trusted-cert -d -r trustRoot \
          -k /Library/Keychains/System.keychain /tmp/cert.pem
        echo "==> Certificate added to trusted root"

        rm /tmp/cert.p12 /tmp/cert.pem
        echo "==> Certificate import complete"

    - name: Diagnose signing environment
      run: |
        echo "==> Keychain list:"
        security list-keychains
        echo ""
        echo "==> Default keychain:"
        security default-keychain
        echo ""
        echo "==> All identities (codesigning):"
        security find-identity -v -p codesigning
        echo ""
        echo "==> All identities (all):"
        security find-identity -v
        echo ""
        echo "==> Checking if 'Local Development Signing' certificate exists..."
        if security find-certificate -c "Local Development Signing" build.keychain >/dev/null 2>&1; then
          echo "✅ Certificate found in build.keychain"
          echo ""
          echo "==> Certificate PEM (first 20 lines):"
          security find-certificate -c "Local Development Signing" -p build.keychain | head -20
          echo ""
          echo "==> Certificate details:"
          security find-certificate -c "Local Development Signing" build.keychain
        else
          echo "❌ ERROR: Certificate 'Local Development Signing' NOT FOUND in build.keychain"
          echo ""
          echo "==> Listing all certificates in build.keychain:"
          security find-certificate -a build.keychain 2>&1 | grep "labl" || echo "No certificates found"
        fi

    - name: Build and package
      run: |
        chmod +x build.sh
        ./build.sh

    - name: Warm up timestamp server connection
      run: |
        echo "==> Testing timestamp server connectivity..."
        for i in 1 2 3; do
          echo "==> Attempt $i of 3"
          if curl -v --connect-timeout 10 https://timestamp.apple.com 2>&1 | grep -q "Connected\|SSL\|200"; then
            echo "✅ Timestamp server reachable"
            exit 0
          fi
          echo "==> Failed, waiting 5s..."
          sleep 5
        done
        echo "⚠️ Warning: Could not reach timestamp server, but will try signing anyway"

    - name: Unlock keychain before signing
      run: |
        echo "==> Ensuring keychain is unlocked..."
        security unlock-keychain -p "" build.keychain
        security default-keychain -s build.keychain
        security list-keychains -s build.keychain

    - name: Sign app
      run: |
        echo "==> Starting signing process..."
        for i in 1 2 3 4; do
          echo ""
          echo "==> Attempt $i of 4"
          echo "==> Running codesign with 60 second timeout..."
          if perl -e '$SIG{ALRM} = sub { exit 14 }; alarm 60; exec @ARGV or exit 1' -- codesign --force --deep --sign "Local Development Signing" TabloDB.app 2>&1 | tee /tmp/sign.log; then
            echo "✅ Signed successfully on attempt $i"
            echo ""
            echo "==> Verifying signature..."
            codesign -dvvv TabloDB.app 2>&1 | head -20
            exit 0
          fi

          EXIT_CODE=$?
          echo "❌ Attempt $i failed with exit code $EXIT_CODE"
          echo ""
          echo "==> Sign log output:"
          cat /tmp/sign.log
          echo ""

          if grep -q "timestamp service is not available\|A timestamp was expected but was not found" /tmp/sign.log 2>/dev/null; then
            echo "==> Diagnosis: Timestamp service unavailable"
          elif grep -q "no identity found\|could not find" /tmp/sign.log 2>/dev/null; then
            echo "==> Diagnosis: Certificate not found by codesign"
          elif [ $EXIT_CODE -eq 14 ]; then
            echo "==> Diagnosis: Timeout after 60 seconds (no response)"
          else
            echo "==> Diagnosis: Other error (see log above)"
          fi

          if [ $i -lt 4 ]; then
            echo "==> Waiting 15 seconds before retry..."
            sleep 15
          fi
        done

        echo ""
        echo "❌ All 4 attempts failed"
        exit 1

    - name: Create ZIP for Sparkle
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        ditto -c -k --keepParent TabloDB.app "TabloDB-${VERSION}.zip"

    - name: Sign update
      if: startsWith(github.ref, 'refs/tags/')
      id: sign
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        ZIP="TabloDB-${VERSION}.zip"

        echo "${{ secrets.SPARKLE_PRIVATE_KEY }}" > /tmp/sparkle_key.txt
        RAW=$(./.build/artifacts/sparkle/Sparkle/bin/sign_update "$ZIP" --ed-key-file /tmp/sparkle_key.txt)
        rm /tmp/sparkle_key.txt

        SIGNATURE=$(echo "$RAW" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')

        LENGTH=$(stat -f%z "$ZIP")
        BUILD_NUMBER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" TabloDB.app/Contents/Info.plist)

        echo "signature=$SIGNATURE" >> "$GITHUB_OUTPUT"
        echo "length=$LENGTH" >> "$GITHUB_OUTPUT"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "build=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

    - name: Upload app bundle
      uses: actions/upload-artifact@v4
      with:
        name: TabloDB-app
        path: TabloDB.app

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          TabloDB-*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Update appcast
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        VERSION="${{ steps.sign.outputs.version }}"
        SIGNATURE="${{ steps.sign.outputs.signature }}"
        LENGTH="${{ steps.sign.outputs.length }}"
        BUILD="${{ steps.sign.outputs.build }}"
        DATE=$(date -u +"%a, %d %b %Y %H:%M:%S +0000")

        NEW_ITEM=$(cat <<EOF
        <item>
            <title>Version ${VERSION}</title>
            <pubDate>${DATE}</pubDate>
            <sparkle:version>${BUILD}</sparkle:version>
            <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
            <sparkle:minimumSystemVersion>13.0</sparkle:minimumSystemVersion>
            <enclosure
                url="https://github.com/J-Liu/TabloDB/releases/download/v${VERSION}/TabloDB-${VERSION}.zip"
                sparkle:edSignature="${SIGNATURE}"
                length="${LENGTH}"
                type="application/octet-stream"/>
        </item>
        EOF
        )

        python3 - <<PYEOF
        import re
        path = "docs/appcast.xml"
        with open(path) as f:
            content = f.read()

        new_item = """${NEW_ITEM}"""

        content = re.sub(
            r'(<language>en</language>)',
            r'\1\n\n    ' + new_item,
            content,
            count=1
        )

        with open(path, "w") as f:
            f.write(content)
        PYEOF

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add docs/appcast.xml
        git commit -m "Update appcast for v${VERSION}"
        git push origin HEAD:main
